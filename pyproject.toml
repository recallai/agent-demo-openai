[project]
name = "openai-meeting-agent"
version = "0.1.0"
description = "A small native OpenAI Realtime voice agent with Recall meeting tools."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.12,<4",
    "fastapi>=0.115,<1",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.34,<1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
